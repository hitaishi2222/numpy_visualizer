[project]
name = "npz-visualizer"
version = "0.1.0"
description = "Local web dashboard for exploring numpy .npz archives with interactive XY charts"
requires-python = ">=3.11"
dependencies = [
    "reflex",
    "xy[reflex]>=0.0.1",
    "numpy",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["reflex_xy"]
